name: Build, vet, and guardrails

# Story 1.3 (AC25): this workflow invokes the guardrails; it never
# re-implements any part of them (D-1.2.6, Story 1.2 Finding 8). Each
# job below is exactly the command a developer runs locally, with no
# CI-only logic — go build/go vet/gofmt for each of the three Go
# modules, folio8-go's untagged test suite (which is where the two
# existing guards — internal/arch_test.go's no-float64 check and
# internal/pdf/emit_source_test.go's numeric-formatting check — and
# DW-1's fixture-shape red-proof live), and lint's own test suite (which
# is where the AD-1 import/math-selector lint, the map-range check and
# the AD-26 licence check + manifest live, all as production/fixture
# caller pairs under `go test ./...`, per AC1). The cross-target matrix
# (matrix.yml) is a separate, per-epic-cadence workflow (D-000.4) and is
# out of scope here.
#
# D-000.11 (Story 1.4 finisher): every `go test` invocation here runs
# with -count=1. Go's test cache does not track reads of files OUTSIDE
# the module — every guard in this repo reads at least one (the drift
# test reads _bmad-output/specs/spec-folio/folio-format.md; lint's
# absence tripwires read directory paths across the repo; fixture_test.go
# reads fixtures/minimal-rect/expected.json at the repo root). Without
# -count=1, actions/setup-go's restored cache can report a stale "ok" for
# a guard whose out-of-module input changed since the cache was primed —
# reproduced decisively: with the cache primed, injecting real drift into
# folio-format.md gives `ok (cached)` on a plain `go test`, and only
# `go test -count=1` catches it. A cached ok is not evidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.0"

  # folio-dotnet (client-libraries story 6). An EXACT version, like
  # GO_VERSION and for the same reason: the SDK builds the netstandard2.0
  # assembly both target frameworks consume, so a floating "10.0.x" would be a
  # second uncontrolled input to a byte-identity claim — and a comment calling
  # it pinned while it drifts is worse than no comment. This is the SDK
  # present on the development host, so CI and a developer compile with the
  # same one.
  DOTNET_VERSION: "10.0.400"

  # D-000.74: the ONE test this repository is permitted to expect red, as a
  # SINGLE SCALAR and deliberately not a list. A second expected red requires
  # its own owner decision and its own accommodation; it may not be appended
  # here, because turning this scalar into a collection is a change of SHAPE
  # that a reviewer sees, where appending a line is not (D-3.4.6's fixed-bound
  # idiom, applied to a CI allowlist).
  #
  # The red is TestCorpusMeetsP6ExerciseFloors — P6g's opaque-name floor,
  # mandated unmet by D-000.17 / D-2.1.14 / D-000.57 and never to be "fixed",
  # amended or ratcheted. It runs, visibly, in the folio8-go-known-red job below.
  #
  # THE ANCHORS ARE LOAD-BEARING. Go's -run/-skip take UNANCHORED regexps, so
  # the unanchored form silently also skips TestCorpusMeetsP6ExerciseFloorsFoo:
  # measured, and it is why this is written ^...$. Anchored, a rename stops
  # matching, the test runs in the green job, and the green job reddens —
  # which is the fail-safe direction. Verified both ways before this landed.
  KNOWN_RED_TEST: "^TestCorpusMeetsP6ExerciseFloors$"

  # DW-268. The three tests below are NOT expected reds and are NOT
  # tolerated failures. They are tests whose INPUTS a GitHub-hosted runner
  # does not have, so the folio8-go-matrix job below is scoped to what a
  # runner can actually reproduce rather than shipping a job that fails on
  # every push (which teaches everyone to ignore it) or one that tolerates
  # any failure (which is worse than no job at all — D-000.74's mechanism
  # that grows).
  #
  # THEY ARE THREE SEPARATE SCALARS, EACH NAMED FOR ITS OWN REASON, and the
  # step below spells all three out in its `-skip` expression. That is
  # D-000.74's shape argument applied here: a FOURTH exclusion cannot be
  # added by appending a line to a list — it must add a scalar AND widen the
  # command, in two places a reviewer reads. Anchored ^...$ for the same
  # reason KNOWN_RED_TEST is: a rename must stop matching and redden the
  # job, never silently widen it.
  #
  # Nothing else in the tagged suite is excluded. In particular the five
  # human-sign-off gates (declared-variants, statement, shaped-text,
  # expected-breaks, thai-stacked-marks) — the FIELD checks that a blanked
  # attestation slips past, and the reason DW-268 exists — run here in full.
  #
  # (1) needs .font-sources/, four upstream variable-font builds totalling
  #     ~22 MB that are gitignored, plus Python 3.12.13 with fontTools
  #     4.63.0 exactly (fontTools is not byte-deterministic across
  #     versions). D-000.12(4) and the Epic 16 boundary gate already ruled
  #     that CI does not have that toolchain and cannot acquire it; this is
  #     that standing ruling honoured, not a new concession. The test fails
  #     rather than skips when its sources are absent — deliberately, per
  #     its own doc comment — so it must be named here or the job is red
  #     forever. What it guards stays guarded per-commit by the untagged
  #     accounting test in folio8-go/fonts (Story 16.11).
  MATRIX_TEST_NEEDING_FONT_SOURCES: "^TestShippedFacesReproduceFromUpstream$"
  # (2) and (3) are the harness's two SINGLE-MACHINE entry points: each
  #     loops over all four targets in one process, so it needs a host that
  #     is darwin/arm64 natively AND has a Docker daemon with linux/amd64 +
  #     linux/arm64 platforms AND has Node. On a Linux runner the
  #     darwin/arm64 leg reaches runOnTarget's default branch and fatals
  #     ("no runner defined for target darwin/arm64"); GitHub's macOS
  #     runners provide no Docker daemon. No runner in existence satisfies
  #     both halves, which is exactly why AC13 shaped matrix.yml as four
  #     NATIVE per-target legs plus a compare job. Their claims are covered
  #     there, per target and per document, by
  #     render-*/compare-render-hashes and fma-probe-*/
  #     assert-fma-probe-diverges — so this is coverage relocated, not
  #     coverage dropped, and matrix.yml runs on the same push/PR events as
  #     this file.
  MATRIX_TEST_NEEDING_ALL_FOUR_TARGETS_RENDER: "^TestCrossTargetByteIdentity$"
  MATRIX_TEST_NEEDING_ALL_FOUR_TARGETS_PROBE: "^TestFMAProbeDiverges$"

jobs:
  folio8-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        working-directory: folio8-go
        run: go build ./...
      - name: go vet
        working-directory: folio8-go
        run: go vet ./...
      # DW-268: this step still only COMPILES the tagged code. It is kept
      # because it is the cheap, early signal, and because it covers the
      # non-test tagged files too — but it is no longer the only thing CI
      # does with the tag: the folio8-go-matrix job below RUNS the tagged
      # suite. The old parenthetical here ("does not run the matrix") was
      # true of the whole repository until DW-268 and is now true only of
      # this step.
      - name: go build -tags=matrix (this step compiles only; folio8-go-matrix runs it)
        working-directory: folio8-go
        run: go build -tags=matrix ./...
      - name: go vet -tags=matrix
        working-directory: folio8-go
        run: go vet -tags=matrix ./...
      - name: gofmt -l (must be empty)
        working-directory: folio8-go
        run: test -z "$(gofmt -l .)"
      # D-000.74 (3): the green job asks ONE question — "is anything NEW
      # broken?" — so the single sanctioned red is excluded from it and
      # nothing else is. No continue-on-error on this job, ever: that would
      # make EVERY failure here non-fatal, which is the mechanism that grows.
      - name: go test -count=1 -skip "$KNOWN_RED_TEST" ./... (must be GREEN)
        working-directory: folio8-go
        run: go test -count=1 -skip "$KNOWN_RED_TEST" ./...

  # RED BY DESIGN. The job name is the disclosure: this job going GREEN is the
  # surprising event, not this job going red. It is quarantined into a job of
  # its own rather than skipped or silenced, so the unmet floor is reported
  # unmet in three places at once — the test output, this job's name, and the
  # epic gate document (D-000.17: a floor that is not met is reported as
  # unmet; it is never filled).
  #
  # No continue-on-error here either. Laundering this green would put an unmet
  # floor behind a green badge, and the badge is the most-read surface in the
  # repository. Two greens and one red whose name explains itself is honest;
  # three greens is not.
  #
  # What guards the NUMBERS rather than the colour is
  # TestCorpusP6StatsMatchDeclaredBaseline, which is green and runs in the
  # folio8-go job above, NOT here — D-000.57's third clause, executed instead of
  # narrated. Without it, a green job would stay green through P6g:7 -> 3.
  folio8-go-known-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # The expectation is ASSERTED, not inherited. Running the known-red test
      # and letting its own exit code become the job's made this job — and so
      # the whole workflow — unconditionally red: 12 of 12 runs from 2026-08-26
      # to 28cd225 concluded `failure`, and on 28cd225 this job was the SOLE
      # cause while every other job passed. A workflow that has never been green
      # cannot be distinguished from a broken one, so its red carried no
      # information and a real gofmt breakage sat in it unnoticed.
      #
      # Inverting it makes BOTH directions informative: green while the
      # quarantine holds, red the moment the known-red starts passing — which is
      # the signal that the quarantine should be deleted, and which the previous
      # form could never have delivered.
      - name: "go test -count=1 -run \"$KNOWN_RED_TEST\" (EXPECTED RED, asserted — D-000.17/D-2.1.14/D-000.57)"
        working-directory: folio8-go
        run: |
          if go test -count=1 -run "$KNOWN_RED_TEST" ./internal/text/; then
            echo "::error::$KNOWN_RED_TEST PASSED, but this job exists because it is expected to FAIL. Either the known-red has been fixed — in which case delete this job and the KNOWN_RED_TEST env var — or the exercise floor it guards has been lowered. Do not silence this by widening the filter."
            exit 1
          fi
          echo "$KNOWN_RED_TEST failed as expected; the quarantine still holds."

  # DW-268. THE TAGGED SUITE, RUN — not built, not vetted, RUN.
  #
  # Until this job existed, `-tags=matrix` code was compiled on every push
  # (folio8-go, above) and executed nowhere: matrix.yml runs only
  # `-run TestTargetRenderHash` and `-run TestTargetProbeHex`, eight legs of
  # a suite of thirteen tagged tests. Everything else under the tag —
  # including all five HUMAN SIGN-OFF gates — ran only when a person typed
  # the epic-boundary command by hand. That is not a cadence, it is a hope,
  # and it cost two measured defects in a single session: a declared-variants
  # attestation blanked to reader:"", examined:"", date:"tomorrow-ish" left
  # the untagged suite byte-identical to baseline, because the field checks
  # live under the tag. The owner priced this job's minutes against that and
  # decided it is worth them.
  #
  # It is a JOB and not a step in folio8-go for the reason folio8-go-known-red
  # is a job: its name is the disclosure. "folio8-go-matrix ran and was green"
  # is a claim a reader can see in the checks list without opening a log.
  #
  # SEPARATE JOB, SEPARATE RUNNER, and deliberately NOT `needs: folio8-go` —
  # the two ask different questions and a reader is entitled to both answers
  # on a run where one of them is red.
  #
  # No continue-on-error. Same reason as everywhere else in this file.
  folio8-go-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # -count=1 for D-000.11's reason, which bites HARDER here than in the
      # untagged job: the sign-off gates read fixture files OUTSIDE the
      # module (fixtures/declared-variants/signoff.json and friends at the
      # repo root), and Go's test cache does not track those reads. A cached
      # ok on a gate whose attestation has since been blanked is precisely
      # the failure DW-268 exists to prevent.
      #
      # The -skip expression names FOUR tests and no more: one sanctioned
      # red (KNOWN_RED_TEST, which the quarantine job above asserts still
      # fails) and three whose inputs no GitHub runner has. Each is its own
      # env scalar, defined and justified at the top of this file. This is an
      # ALLOWLIST, not a tolerance: a fifth failure — anything at all, in any
      # package, under the tag or not — reddens this job.
      - name: "go test -count=1 -tags=matrix (UNFILTERED but for four NAMED tests; must be GREEN)"
        working-directory: folio8-go
        run: |
          go test -count=1 -tags=matrix \
            -skip "$KNOWN_RED_TEST|$MATRIX_TEST_NEEDING_FONT_SOURCES|$MATRIX_TEST_NEEDING_ALL_FOUR_TARGETS_RENDER|$MATRIX_TEST_NEEDING_ALL_FOUR_TARGETS_PROBE" \
            ./...

  hashmatrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet ./...
        working-directory: hashmatrix
        run: go vet ./...
      - name: build the probe binary (plain "go build ./..." exits 1 by design, Story 1.2)
        working-directory: hashmatrix
        run: |
          mkdir -p /tmp/hashmatrix-build
          go build -o /tmp/hashmatrix-build/probe ./probe
      # NOTE: this name is QUOTED because it contains ": ". An unquoted YAML
      # plain scalar may not contain a colon-space; it made this whole file
      # unparseable, and therefore ci.yml had NEVER run, from Story 3.3 until
      # the first push (D-000.71: a signal that has never run cannot be cited).
      - name: "go test ./... (Story 3.3, D-3.3.7: floatdiscrimination/ is a real guard only if this runs it)"
        working-directory: hashmatrix
        run: go test -count=1 ./...
      - name: gofmt -l (must be empty)
        working-directory: hashmatrix
        run: test -z "$(gofmt -l .)"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        working-directory: lint
        run: go build ./...
      - name: go vet
        working-directory: lint
        run: go vet ./...
      - name: gofmt -l (must be empty)
        working-directory: lint
        run: test -z "$(gofmt -l .)"
      # QUOTED for the same reason as above — this one has carried the defect
      # since Story 1.3.
      - name: "go mod download all (D-1.3.11: populates the module cache for lint's WHOLE module graph, not just the packages it imports directly, so the GOPROXY=off step below can resolve every dependency's LICENSE file offline)"
        working-directory: lint
        run: go mod download all
      # D-000.75. lint's packages.Load type-checks the SIBLING module folio8-go
      # (bigfloattype, floattyped, maprange, licencegraph, visibilitysignature,
      # glyphidcensus). lint/go.mod does not require folio8-go and there is no
      # go.work, so the download above populates LINT's graph only — folio8-go's
      # own require (boxesandglue/textshape, folio8-go/go.mod:20) stays absent
      # and, under GOPROXY=off below, every type-checking rule degrades.
      #
      # Measured A/B in two freshly-created empty GOMODCACHE directories, not
      # from a warm cache: WITHOUT this step, 101 pass / 13 fail, EXIT=1
      # ("invalid package name" on textshape/subset). WITH it, 114 pass, EXIT=0.
      # Eleven of the twelve failing functions have been latent since Story 1.3.
      #
      # Do NOT "fix" this by dropping GOPROXY=off below — that flag is
      # D-1.3.11's deliberate offline licence check, and removing it trades a
      # loud failure for a silent dependency on the network (D-000.58's
      # declined shape).
      - name: go mod download all (folio8-go's graph — lint type-checks it across the module boundary)
        working-directory: folio8-go
        run: go mod download all
      - name: go test -count=1 ./... (AD-1 lint, map-range, fonts-assets, licence check + manifest — production and fixture scans, AC1)
        working-directory: lint
        env:
          GOPROXY: "off"
        run: go test -count=1 ./...

  folio8-designer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: folio8-designer/package-lock.json
      - name: npm ci (committed lockfile only)
        working-directory: folio8-designer
        run: npm ci
      # STORY 17.6 (discharging DW-171 and DW-152). `npm run test` is
      # `npm run build:wasm && vitest run`; the wasm build is kept because
      # vitest imports its output.
      #
      # THE NAME FILTER IS GONE, and that is this step's whole point. The
      # AD-17 corpus scan is green again, so the designer suite runs WHOLE and
      # NO test is excluded from this job by name. There is no designer
      # counterpart to KNOWN_RED_TEST any more, and there is no quarantined
      # designer job for one to point at.
      #
      # No continue-on-error, here or anywhere: that would make every failure
      # in this job non-fatal, which is the mechanism that grows.
      - name: unit and contract tests (must be GREEN; the WHOLE suite, no name filter)
        working-directory: folio8-designer
        run: |
          npm run build:wasm
          npx vitest run
      - name: TypeScript check
        working-directory: folio8-designer
        run: npm run typecheck
      - name: lint
        working-directory: folio8-designer
        run: npm run lint
      - name: production build
        working-directory: folio8-designer
        run: npm run build
      - name: offline release red controls (D-000.81)
        working-directory: folio8-designer
        run: npm run verify:offline:red
      - name: emitted wasm dictionary witness
        working-directory: folio8-designer
        run: npm run verify:offline:wasm
      - name: compile deferred browser smoke suite (D-000.4)
        working-directory: folio8-designer
        run: npm run test:e2e:compile

  # folio-js (client-libraries story 4): the Node binding over
  # folio8-go/wasm/cmd/render. `npm run build` compiles that wasm with the
  # pinned Go toolchain, so setup-go is required, and the tests assert golden
  # hashes and diagnostic parity against the Go engine.
  folio-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: folio-js/package-lock.json
      - name: vet the render wasm entry under js/wasm
        working-directory: folio8-go
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./wasm/cmd/render
      - name: npm ci (committed lockfile only)
        working-directory: folio-js
        run: npm ci
      - name: build (render wasm + TypeScript)
        working-directory: folio-js
        run: npm run build
      - name: lint (oxlint and a type check of src and tests)
        working-directory: folio-js
        run: npm run lint
      # Story 5's offline-install proof (CAP-6) lives in this suite, not in a
      # step of its own: test/package.test.ts packs the tarball, installs it
      # into a temp project with its own npm cache and --offline, and runs the
      # README's first-PDF snippet against a corpus fixture. It needs nothing
      # this job does not already have, and keeping it inside `npm test` means
      # a developer runs the same proof locally with the same command.
      - name: test (golden hashes, Go diagnostic parity, and the offline install)
        working-directory: folio-js
        run: npm test

  # DW-268. THE BROWSER SUITE, RUN.
  #
  # `npm run test:e2e` — 36 Playwright tests at the time this was written —
  # ran in NO workflow at all. Do not maintain that count here: it moved 52 ->
  # 55 -> 58 in a single day (2026-09-10) as two stories added specs, so any
  # integer written down is stale within hours. Measure it instead:
  #   git grep -cE '^ *test\(' -- 'folio8-designer/e2e/*.spec.ts'
  # The only e2e-shaped thing CI did was `test:e2e:compile`, which is
  # `tsc --noEmit` over the spec files: it proves the specs still typecheck,
  # which is not the same claim as the specs still passing, and the
  # difference was measured. e2e/browser-native-roundtrip.spec.ts was broken
  # for two days across two epics with nobody noticing, because the suite
  # ran only at epic boundaries; its evidence manifest had been stale since
  # 2026-08-30 and the staleness was the only trace. The compile step above
  # stays — it is seconds, it covers the specs' types, and it fails earlier
  # and more legibly than a browser run does.
  #
  # A SEPARATE JOB, not more steps on folio8-designer, for three reasons that
  # are about this suite specifically and not about tidiness: it needs a
  # browser download the other job has no use for; it needs the GO toolchain
  # (see below), which the other job does not install; and at ~36 serial
  # browser tests it is by some distance the longest thing here, so hanging
  # it off the end of folio8-designer would delay every fast signal in that
  # job behind it.
  #
  # WHY setup-go IS HERE. This is not a browser-only suite.
  # browser-native-roundtrip.spec.ts builds folio8-go/cmd/folio8, runs it over
  # the template the browser just authored, asserts the native PDF is
  # BYTE-EQUAL to the wasm-rendered one, and then shells into
  # `go test -run ^TestBrowserAuthoredRoundTripWitness$`. Without a pinned
  # Go it would either fail outright or — worse — measure byte identity
  # against a different toolchain than every other job in this file, which
  # is AD-22's drift class arriving through the back door. Same GO_VERSION
  # as everywhere else, deliberately.
  #
  # NO BROWSER OVERRIDE. playwright.config.ts honours
  # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH when set; it is deliberately NOT set
  # here, so CI uses the Chromium the pinned @playwright/test downloaded —
  # the version-managed one, not whatever the runner image happens to ship.
  #
  # NO webServer OF OUR OWN. playwright.config.ts's webServer already runs
  # `npm run build && npm run preview` on 127.0.0.1:4173 with
  # reuseExistingServer: false, so this job must NOT start a server or
  # pre-build; doing so would either be ignored or collide on the port. The
  # config owns that, and this job invokes the config.
  #
  # No continue-on-error. A flaky-looking browser test is a defect report,
  # not a reason to make this job advisory.
  folio8-designer-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: folio8-designer/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: npm ci (committed lockfile only)
        working-directory: folio8-designer
        run: npm ci
      # --with-deps installs the shared libraries headless Chromium needs on
      # a bare ubuntu image; chromium alone, because playwright.config.ts
      # declares no projects and so runs the default browser only.
      - name: install the pinned Playwright Chromium
        working-directory: folio8-designer
        run: npx playwright install --with-deps chromium
      - name: "browser end-to-end suite (npm run test:e2e; the config builds and previews the app itself)"
        working-directory: folio8-designer
        run: npm run test:e2e
      # Only on failure, and only the report: a green run's traces are noise
      # and cost storage, while a red run's are the difference between a
      # reproducible defect and "it went red on CI once".
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: folio8-designer/playwright-report/
          retention-days: 7
          # `error`, not `ignore` (changed 2026-09-08, DW-297). This step spent
          # five red runs uploading a directory that playwright.config.ts never
          # created, because no reporter was configured -- and `ignore` is what
          # made that silent instead of obvious. The config now writes an html
          # report with `trace: 'retain-on-failure'`, so on a red run this path
          # exists. If it ever stops existing, that is a defect in the evidence
          # chain and this job should SAY so, even though it is already failing
          # for another reason. A missing report is not a tidy edge case; it is
          # the difference between a reproducible defect and a rumour.
          if-no-files-found: error

  # folio-dotnet (client-libraries story 6): the .NET binding over the
  # c-shared build of the engine. THE ONLY WINDOWS JOB IN THIS REPOSITORY,
  # and it has to be — .NET Framework 4.6 is Windows-only by definition, and
  # the win-x86/win-x64 DLLs are the artifacts the whole binding rests on.
  # Nothing here can be reproduced on the host CI above, which is exactly why
  # the story treats a green run of this job as the only evidence that the
  # Windows half works.
  #
  # Three claims, three steps, in dependency order: both DLLs build; the
  # sources fit inside .NET Framework 4.6's API surface; and the same
  # netstandard2.0 assembly renders and validates correctly on net48 AND on
  # modern .NET, matching the committed golden hashes and the recorded Go
  # diagnostics.
  #
  # No continue-on-error. Same reason as everywhere else in this file.
  folio-dotnet:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # -buildmode=c-shared needs cgo, and cgo needs a mingw-w64 toolchain PER
      # ARCHITECTURE.
      #
      # The x86_64 one is NOT installed here: the runner image ships a
      # standalone mingw-w64 at C:\mingw64 that involves MSYS2 not at all, and
      # build-native.ps1 prefers it for exactly that reason. MSYS2 is needed
      # only for the i686 toolchain, which has no standalone counterpart on
      # the image and which win-x86 — the .NET Framework 4.6 floor — cannot do
      # without.
      #
      # `-Syuu` FIRST, TWICE, then install. A plain `pacman -S` against a stale
      # local database is how you get a partially upgraded toolchain: a
      # gcc.exe newer than the runtime DLLs sitting beside it, which starts
      # and then dies at load time with no stderr. MSYS2's own guidance is to
      # run the full upgrade before installing anything, and to run it twice
      # because the first pass can replace the msys2 runtime and stop.
      #
      # None of it is fatal on its own: build-native.ps1 PROVES each candidate
      # compiler by compiling with it, and fails naming every compiler it
      # tried and why each was rejected — a far more legible failure than a
      # package-manager transcript.
      - name: mingw-w64 i686 toolchain (MSYS2)
        shell: pwsh
        run: |
          $pacman = 'C:\msys64\usr\bin\pacman.exe'
          if (Test-Path $pacman) {
            foreach ($pass in 1, 2) {
              & $pacman -Syuu --noconfirm
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::pacman -Syuu pass $pass exited $LASTEXITCODE" }
            }
            & $pacman -S --noconfirm --needed mingw-w64-i686-gcc mingw-w64-x86_64-gcc
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::pacman -S exited $LASTEXITCODE; build-native.ps1 will report which compilers actually work" }
          } else {
            Write-Host "::warning::no MSYS2 pacman on this image; relying on preinstalled toolchains"
          }
      # Cheap, unconditional inventory. When the build step fails, this is the
      # first thing a reader wants and the last thing they can reconstruct
      # afterwards.
      - name: inventory the compilers on this image
        shell: pwsh
        run: |
          foreach ($candidate in 'C:\mingw64\bin\gcc.exe', 'C:\msys64\mingw64\bin\gcc.exe', 'C:\msys64\mingw32\bin\gcc.exe') {
            if (Test-Path $candidate) {
              $version = (& $candidate --version 2>&1 | Select-Object -First 1)
              Write-Host "$candidate  ->  $version"
            } else {
              Write-Host "$candidate  ->  ABSENT"
            }
          }
      - name: build win-x64 and win-x86 DLLs (-buildmode=c-shared)
        shell: pwsh
        run: ./folio-dotnet/build/build-native.ps1 win-x64 win-x86
      # A build that "succeeded" without producing both artifacts is not a
      # pass. Asserted, not inferred from an exit code.
      #
      # AND THE EXPORT TABLE IS DUMPED, unconditionally, for both
      # architectures. A DLL that loads but has no reachable entry point is
      # indistinguishable from one that was never built right, unless someone
      # can read what it actually exports — and that question cost a full CI
      # round trip once already. `dumpbin` is on the image; mingw's objdump
      # sits beside whichever gcc build-native.ps1 chose, so both are tried.
      - name: both DLLs exist, and export the folio8_ symbols
        shell: pwsh
        run: |
          $objdumps = @('C:\mingw64\bin\objdump.exe', 'C:\msys64\mingw64\bin\objdump.exe', 'C:\msys64\mingw32\bin\objdump.exe')
          $objdump = $objdumps | Where-Object { Test-Path $_ } | Select-Object -First 1
          $dumpbin = Get-ChildItem -Recurse -ErrorAction SilentlyContinue -Filter dumpbin.exe 'C:\Program Files\Microsoft Visual Studio' |
                     Select-Object -First 1 -ExpandProperty FullName
          foreach ($rid in @('win-x64', 'win-x86')) {
            $dll = "folio-dotnet/build/native/$rid/folio8_native.dll"
            if (-not (Test-Path $dll)) { throw "$dll was not produced" }
            Write-Host "=== $rid ok: $((Get-Item $dll).Length) bytes ==="
            $symbols = @()
            if ($objdump) {
              Write-Host "--- $objdump -p ---"
              # -notmatch '\.dll' drops objdump's own header lines, which name
              # the file and would otherwise count as an export.
              $symbols = & $objdump -p $dll 2>&1 | Select-String -Pattern 'folio8_' | Where-Object { $_ -notmatch '\.dll' }
            } elseif ($dumpbin) {
              Write-Host "--- $dumpbin /exports ---"
              $symbols = & $dumpbin /exports $dll 2>&1 | Select-String -Pattern 'folio8_' | Where-Object { $_ -notmatch '\.dll' }
            } else {
              Write-Host "::warning::neither objdump nor dumpbin was found; the export table cannot be shown"
            }
            $symbols | ForEach-Object { Write-Host "  $_" }
            # The count is the assertion. Eight exports, or this DLL cannot
            # satisfy the binding no matter what the managed side does.
            if ($objdump -or $dumpbin) {
              $names = $symbols | ForEach-Object { $_.ToString() } | Select-String -Pattern 'folio8_[a-z_]+' -AllMatches |
                       ForEach-Object { $_.Matches } | ForEach-Object { $_.Value } | Sort-Object -Unique
              Write-Host "  distinct folio8_ exports: $($names.Count) -> $($names -join ', ')"
              if ($names.Count -lt 8) { throw "$dll exports only $($names.Count) folio8_ symbols; expected 8" }
            }
          }
      # THE FLOOR, CHECKED BY THE COMPILER. This project compiles the shipped
      # sources against .NET Framework 4.6 reference assemblies, so reaching
      # for an API 4.6 lacks reddens here instead of on a customer's machine.
      - name: .NET Framework 4.6 compile check
        run: dotnet build folio-dotnet/test/Folio8.Net46Compile/Folio8.Net46Compile.csproj -c Release
      # net48 and modern .NET, from ONE netstandard2.0 assembly — the project
      # multi-targets on Windows, so this single command covers both and the
      # run summary names each. The win-x64 DLL is what the project stages by
      # default.
      - name: tests on net48 and modern .NET, 64-bit (golden hashes and Go diagnostic parity)
        run: >
          dotnet test folio-dotnet/test/Folio8.Tests/Folio8.Tests.csproj -c Release
          --logger "trx;LogFileName=folio-dotnet-x64.trx"
          --results-directory folio-dotnet/TestResults
      # THE 32-BIT LEG, AND IT IS NOT CEREMONY. Everything above runs x64,
      # which has ONE calling convention — so an x64-only suite passes with
      # CallingConvention.Cdecl deleted from every DllImport. On x86, cdecl and
      # the .NET default (stdcall) disagree about who cleans the stack, and x86
      # IS the .NET Framework 4.6 floor this library exists to reach. Without
      # this step the win-x86 DLL is only proved to EXIST.
      #
      # It swaps the staged DLL and re-runs with --no-build, rather than
      # rebuilding into a second output tree: the test assembly is AnyCPU, so
      # the same build runs in either host, and rebuilding would only re-stage
      # the x64 library over the x86 one.
      #
      # net48 only: setup-dotnet installs no 32-bit modern .NET runtime, so
      # there is no x86 host for the net10.0 target to run in. net48 consumes
      # the same netstandard2.0 assembly, so the ABI is proved on x86 either
      # way.
      - name: stage the win-x86 DLL beside the net48 test assembly
        shell: pwsh
        run: |
          $out = 'folio-dotnet/test/Folio8.Tests/bin/Release/net48'
          if (-not (Test-Path $out)) { throw "$out does not exist; the 64-bit test step should have built it" }
          Copy-Item -Force 'folio-dotnet/build/native/win-x86/folio8_native.dll' (Join-Path $out 'folio8_native.dll')
          # What the 32-bit host will actually resolve, listed before it runs.
          Get-ChildItem $out -Filter '*folio8*' | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }
      - name: tests on net48, 32-bit (proves the Cdecl calling convention)
        run: >
          dotnet test folio-dotnet/test/Folio8.Tests/Folio8.Tests.csproj -c Release
          --no-build --framework net48
          --settings folio-dotnet/test/Folio8.Tests/x86.runsettings
          --logger "trx;LogFileName=folio-dotnet-x86.trx"
          --results-directory folio-dotnet/TestResults
      # Always, not only on failure: a green run's trx is the evidence that
      # both legs actually ran, which is the claim this job exists to make.
      # if-no-files-found: error for the reason the designer job gives — a
      # missing report is a break in the evidence chain, not a tidy edge case.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-dotnet-windows-trx
          path: folio-dotnet/TestResults/*.trx
          retention-days: 7
          if-no-files-found: error

  # THE HOST PATH, RUN. build-native.sh and everything it produces ran in NO
  # workflow: renaming its output, or breaking the host leg of the script,
  # would have left every developer's `./build/build-native.sh && dotnet test`
  # broken with CI still green. That is the same gap DW-268 closed elsewhere
  # in this file, and it is closed here before it can cost anything.
  #
  # It is also the cheap signal. The Windows job needs two mingw toolchains
  # and two test hosts; this one needs a Go toolchain and an SDK, and it fails
  # in a couple of minutes on anything that broke the binding itself rather
  # than the Windows half of it.
  #
  # ubuntu, not macOS: the same script's Linux branch, on the runner class
  # every other job in this file already uses.
  folio-dotnet-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: build the host library (build-native.sh, the developer's own command)
        run: ./folio-dotnet/build/build-native.sh host
      - name: the host library exists, and exports the folio8_ symbols
        run: |
          test -f folio-dotnet/build/native/host/libfolio8_native.so
          # Same question the Windows job asks, asked here too — this is the
          # leg where a missing export would be cheapest to notice.
          # `|| true`: grep exits 1 on no matches, and under `bash -e` that
          # would kill the step before the explicit, legible check below.
          count=$(nm -D --defined-only folio-dotnet/build/native/host/libfolio8_native.so | grep -c ' T folio8_' || true)
          echo "distinct folio8_ exports: $count"
          nm -D --defined-only folio-dotnet/build/native/host/libfolio8_native.so | grep ' T folio8_'
          test "$count" -eq 8
      # The 4.6 reference assemblies come from a NuGet package, so the floor
      # check runs here too — on Linux, with no .NET Framework installed.
      - name: .NET Framework 4.6 compile check
        run: dotnet build folio-dotnet/test/Folio8.Net46Compile/Folio8.Net46Compile.csproj -c Release
      - name: tests on the modern target (golden hashes and Go diagnostic parity)
        run: >
          dotnet test folio-dotnet/test/Folio8.Tests/Folio8.Tests.csproj -c Release
          --logger "trx;LogFileName=folio-dotnet-host.trx"
          --results-directory folio-dotnet/TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folio-dotnet-host-trx
          path: folio-dotnet/TestResults/*.trx
          retention-days: 7
          if-no-files-found: error
