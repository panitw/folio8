  assert-fma-probe-diverges:
    needs:
      - fma-probe-darwin-arm64
      - fma-probe-linux-amd64
      - fma-probe-linux-arm64
      - fma-probe-js-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          path: probes
          merge-multiple: true
      # This job's shell logic mirrors TestFMAProbeDiverges's AC9 relation
      # check in folio8-go/matrix_test.go (allEqual /
      # bothArm64DifferFromWasm). AC13 requires a job asserting AC9's
      # partition, so re-deriving the relation here (rather than a hash
      # comparison) is compliant, not a violation — but the two
      # implementations are NOT pinned together mechanically: if the Go
      # relation is ever strengthened, update this mirror in the same
      # change, or CI would silently keep asserting the weaker one
      # (Finding 8).
      - name: Assert AC9's divergence relation
        run: |
          set -euo pipefail
          want_files="probes/probe.darwin-arm64.txt probes/probe.linux-amd64.txt probes/probe.linux-arm64.txt probes/probe.js-wasm.txt"

          count=0
          for f in $want_files; do
            if [ ! -f "$f" ]; then
              echo "MISSING artifact: $f — a matrix leg must fail, never silently vanish (AC11, Blocker 2 family)"
              exit 1
            fi
            got="$(cat "$f")"
            if ! printf '%s' "$got" | grep -Eq '^[0-9a-f]{16}$'; then
              echo "MALFORMED probe output in $f: \"$got\" (want exactly 16 lower-case hex characters — 8 raw bytes, AC8)"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -ne 4 ]; then
            echo "expected exactly 4 probe outputs, got $count (AC11)"
            exit 1
          fi

          darwin_arm64="$(cat probes/probe.darwin-arm64.txt)"
          linux_amd64="$(cat probes/probe.linux-amd64.txt)"
          linux_arm64="$(cat probes/probe.linux-arm64.txt)"
          js_wasm="$(cat probes/probe.js-wasm.txt)"
          echo "darwin/arm64  $darwin_arm64"
          echo "linux/amd64   $linux_amd64"
          echo "linux/arm64   $linux_arm64"
          echo "js/wasm       $js_wasm"

          all_equal=1
          if [ "$darwin_arm64" != "$linux_amd64" ] || [ "$darwin_arm64" != "$linux_arm64" ] || [ "$darwin_arm64" != "$js_wasm" ]; then
            all_equal=0
          fi

          both_arm64_differ_from_wasm=1
          if [ "$darwin_arm64" = "$js_wasm" ] || [ "$linux_arm64" = "$js_wasm" ]; then
            both_arm64_differ_from_wasm=0
          fi

          if [ "$all_equal" -eq 1 ] || [ "$both_arm64_differ_from_wasm" -eq 0 ]; then
            echo "the contraction probe no longer diverges across targets; the matrix's ability to detect FMA contraction is unproven — investigate before trusting a green render matrix (AC9)"
            exit 1
          fi
          echo "AC9 relation holds: not all equal, and both arm64 targets differ from wasm."

  # Story 1.3 lands the unit-suite CI job; this workflow is scoped to the
  # matrix per AC13 and does not duplicate it.
