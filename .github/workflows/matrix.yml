name: Cross-target byte identity

# Story 1.2 (AC13): four native per-target render jobs, a compare job that
# fails if any pair differs, and four native per-target FMA-probe jobs plus
# a job asserting AC9's divergence relation. Every job installs exactly
# go-version 1.26.0 (never a 1.26.x range) and sets CGO_ENABLED=0 and
# GOTOOLCHAIN=go1.26.0 — the harness itself also exports both (AC2), so
# this is redundant defence, not the only pin.
#
# No job computes or compares a hash in YAML: each job calls
# `go test -tags=matrix` in folio8-go, the same code path AC1 requires the
# local entry point to use, and the compare jobs below do plain file
# equality checks over the harness's own output files, never hash logic.
#
# Every leg below runs on a native runner (AC13): darwin/arm64 on macos-14,
# linux/amd64 and js/wasm on ubuntu-24.04, linux/arm64 on ubuntu-24.04-arm
# (free on this public repo per D-000.5) — so the harness's Docker runner
# path (needed only for the local single-machine run, F-6) is never
# exercised here. (F-6 itself is widely documented to say GitHub-hosted
# macOS runners provide no Docker daemon, but that claim was explicitly NOT
# measured in this run and is NOT load-bearing — D-1.2.5. AC13 alone, not
# that claim, is why this workflow is shaped as four native per-target jobs
# rather than one job driving Docker from macOS.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.0"

jobs:
  render-darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Render + hash (darwin/arm64)
        working-directory: folio8-go
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: go1.26.0
          FOLIO8_MATRIX_TARGET: darwin/arm64
        run: go test -tags=matrix -run TestTargetRenderHash -v .
      - uses: actions/upload-artifact@v4
        with:
          name: hash-darwin-arm64
