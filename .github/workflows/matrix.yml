  compare-render-hashes:
    needs:
      - render-darwin-arm64
      - render-linux-amd64
      - render-linux-arm64
      - render-js-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: hashes
          merge-multiple: true
      - name: Assert all four render hashes are byte-identical, for every registered document (AC7, Finding 8, Story 1.8 AC22)
        # Blocker 2 (QA review): this step used to glob `hashes/hash.*.txt`
        # with no count and no shape check, so a job that silently wrote no
        # hash (upload-artifact's default if-no-files-found: warn) still
        # let this step compare and report success over three files, and
        # four empty files also compared equal. Every upload-artifact step
        # above now sets if-no-files-found: error, which prevents a
        # missing hash file from reaching this job at all — but this step
        # additionally names the expected files explicitly (never a glob)
        # and asserts each one exists and is a well-formed 64-char
        # lower-case hex string BEFORE any comparison, so absence or a
        # malformed value is a failure here too, defence in depth.
        #
        # Finding 8 (QA review): before this fix, this job — and
        # TestTargetRenderHash, which produces its input files — covered
        # ONLY minimal-rect (the fontless document). font-text (the
        # document whose determinism depends on textshape's internal
        # glyph-map ordering) was covered only by TestCrossTargetByteIdentity,
        # which is //go:build matrix and runs locally/on demand, not in
        # this CI workflow. A textshape upgrade that broke font
        # cross-target byte-identity would have passed CI. This step now
        # loops over both documents; each gets its own MISSING/MALFORMED/
        # count/mismatch checks, exactly mirroring the single-document
        # version this replaces.
        run: |
          set -euo pipefail
          # Story 2.4: wrapped-text joins the list. It is the only
          # registered document whose text does NOT fit its boxes, so it is
          # the only one whose legs can disagree if line breaking is not
          # reproducible across targets.
          # Story 2.3: shaped-text joins the list, and multi-script-fallback
          # is added with it — Story 2.2 registered that document in
          # matrix_test.go's matrixDocuments but never here, so CI has been
          # publishing four documents' worth of legs and comparing three.
          # This hand-maintained list drifting from matrixDocuments is
          # exactly Finding 8's hazard recurring;
          # TestMatrixDocumentSlugsAreRegisteredInCI
          # (folio8-go/matrix_registration_test.go) now asserts the two agree.
          # That file is deliberately UNTAGGED — it carries no //go:build
          # matrix line, so the guard runs in every story's plain
          # `go test ./...` and not only at the epic boundary gate. Running
          # every story is what makes it worth having; matrix_test.go would
          # have been the wrong home for exactly that reason.
          docs="minimal-rect font-text image-embed multi-script-fallback shaped-text wrapped-text three-band-page multi-page page-count-20 hidden-image statement-1 statement-5 statement-20 statement-50 alternating-rows component-asset-import mandatory-break line-spacing justified-text justified-thai alignment-rounding keep-together thai-stacked-marks embedded-font declared-variants barcode-thai-bill-payment qrcode-payments section-break-statement section-break-unanchored multi-page-statement multi-page-flow colour-strokes"
          targets="darwin-arm64 linux-amd64 linux-arm64 js-wasm"

          overall_fail=0
          for doc in $docs; do
            echo "=== $doc ==="
            count=0
            for t in $targets; do
              f="hashes/hash.$t.$doc.txt"
              if [ ! -f "$f" ]; then
                echo "MISSING artifact: $f — a matrix leg must fail, never silently vanish (AC11, Blocker 2, Finding 8)"
                overall_fail=1
                continue
              fi
              got="$(cat "$f")"
              if ! printf '%s' "$got" | grep -Eq '^[0-9a-f]{64}$'; then
                echo "MALFORMED hash in $f: \"$got\" (want exactly 64 lower-case hex characters)"
                overall_fail=1
                continue
              fi
              count=$((count + 1))
              echo "  $f: $got"
            done
            if [ "$count" -ne 4 ]; then
              echo "$doc: expected exactly 4 render hashes, got $count (AC11)"
              overall_fail=1
              continue
            fi

            ref="$(cat "hashes/hash.darwin-arm64.$doc.txt")"
            for t in $targets; do
              got="$(cat "hashes/hash.$t.$doc.txt")"
              if [ "$got" != "$ref" ]; then
                echo "MISMATCH ($doc): hash.$t.$doc.txt = $got, want $ref (NFR1 falsified — see D-1.2.2)"
                overall_fail=1
              fi
            done
            echo "$doc: all four targets agree: $ref"
          done

          if [ "$overall_fail" -ne 0 ]; then
            exit 1
          fi

