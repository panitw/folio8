- id: "1"
  title: Tier the release at build time
  description: >-
    Assign every emitted asset to exactly one tier — core or deferred — and carry that
    assignment in the offline release manifest and the S1 payload, with verification failing a
    build that leaves an asset untiered or grows the core tier past its bound (CAP-5).
  spec_checkpoint: true
  invoke_dev_with: >-
    Nothing about loading behaviour changes in this story: the worker still precaches and
    gates on the whole release. This story only makes the tiering exist and be enforced.

    The core tier is the 29 assets in asset-tiers.md. The bound that matters from here on is
    the CORE tier's asset count, not the release total.

    `minimumCacheAssets`, `maximumCacheAssets` and `warnCacheAssets` in
    folio-designer/src/release-payload.ts are read by
    scripts/offline-release-contract.mjs through a line-anchored reader that requires exactly
    one live `const <name> = <digits>` match. Keep that idiom — `npm run build` runs
    verify:offline but never runs Vitest, so a re-typed constant plus a tie test would leave a
    drifted build green. Derive, never re-type.

    scripts/offline-release-contract.test.mjs asserts `declaredCacheAssetBounds`'s return shape
    by exact equality and drives its failure cases with fixture strings; widening that return
    shape breaks every one of those fixtures for reasons unrelated to the case under test. The
    existing comments in that file explain why `warnCacheAssets` is a separate export — follow
    the same reasoning for anything new.

- id: "2"
  title: Gate the designer on the core tier and fetch the rest on demand
  description: >-
    The designer becomes interactive once the core tier verifies rather than the whole release;
    deferred assets are fetched the first time an author's action needs them and cached
    permanently; the font browser reports per-face what this browser actually holds
    (CAP-1, CAP-2, CAP-4).
  spec_checkpoint: true
  invoke_dev_with: >-
    This is the story that delivers the first-load win: 29 assets / 10.67 MiB blocking instead
    of 80 / 18.63 MiB. Measure a cold-cache load before and after and report both numbers.

    `cacheReady` in folio-designer/src/offline-lifecycle.ts currently means "this browser holds
    a verified release" and gates the engine through `engineMayStart`. It must come to mean the
    CORE tier and must not be readable as a claim about the deferred tier. Keep the
    `import.meta.env.DEV` / `dev-bypass` branch and its property that production bundles
    eliminate it — verify-offline-release.mjs proves that absence and will fail if it leaks.

    Deferred fetches resolve the content-addressed URL of the release THIS page is running.
    `matches()` drops any worker message whose releaseId is not this page's own, and a waiting
    worker is a different release by definition; nothing in this story may let a new asset land
    in an old release's cache. Leave the pending-release, mandatory-upgrade and update-polling
    behaviour alone.

    folio-designer/src/font-store.ts already keeps fetched web-tier faces in IndexedDB, and
    font-browser-model.ts already defines AVAILABLE LOCALLY as the committed catalogue plus the
    faces this designer fetched and kept. Extend that path rather than building a second one —
    but note the definition itself now changes: a catalogue face is no longer locally held just
    by shipping in the release.

    No background prefetch of any kind. On demand means on demand.

- id: "3"
  title: Preflight a document on open
  description: >-
    Opening a document enumerates every asset it needs, fetches what is missing while the
    network is available, and refuses the open naming each missing asset when one is both
    missing and unreachable (CAP-3).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    A first CJK document on a connected machine must OPEN, fetching the font as part of the
    open. Refusal is only for missing-and-unreachable.

    Byte-identity is not negotiable here: never substitute a fallback face for one the document
    declares. The canvas and the preview show the real production output or nothing.

    A catalogue face picked mid-session while offline is refused the same way a preflight miss
    is — same rule, same message shape. That consistency is an assumption recorded in SPEC.md
    rather than an owner ruling; if the implementation makes it awkward, raise it instead of
    quietly diverging.

    No document may open and then fail mid-edit for an asset that was already absent at open.
    That is the property worth a test.

- id: "4"
  title: Refuse a render that needs a face the font set does not carry
  description: >-
    A render whose text needs a face absent from the supplied FontSet fails with a located
    diagnostic naming that face, instead of skipping the chain member and dropping the runes
    under a warning (CAP-7).
  spec_checkpoint: true
  invoke_dev_with: >-
    This story is a no-op for every caller shipping today: `fonts.Shipped()` carries all eleven
    faces, so nothing currently reaches the new refusal. That is deliberate — it lands the
    safety net BEFORE story 5 makes an absent face possible. Do not merge the two.

    Today an absent chain member is silently skipped (folio-go/render.go:1533-1539, with the
    comment at :1711-1713 explaining why), and only TEXT_MISSING_GLYPH (a Warning, :1831-1837)
    fires when nothing covers a rune. Those two outcomes must stay distinguishable: "the
    document names a face nobody supplied" is a refusal; "no supplied face covers this rune" is
    still a warning. Conflating them would make a legitimately-unsupported rune fail a render.

    `folio-go/render.go:1598` already has the sentence — "face %q is not present in the supplied
    FontSet" — as a plain error with no diagnostic code, on a path the normal walk cannot reach.
    Give the condition a real diagnostic code and an element id and data path, and make the
    normal walk reach it. Reuse that wording rather than inventing a second phrasing.

    Six golden fixtures contain Han text with PDF hashes pinned across three languages
    (multi-script-fallback, shaped-text, wrapped-text, statement-1/-5/-20/-50, expected-breaks).
    None of their bytes may move. If one does, stop and report it rather than re-pinning.

- id: "5"
  title: Take the CJK face out of the designer's engine
  description: >-
    The designer's wasm host stops embedding the CJK face and receives it from JS instead,
    supplied from the deferred asset the canvas already fetches; the core tier is re-measured
    and re-pinned to the result (CAP-6).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Scope fence: `fonts.Shipped()` keeps all eleven faces and folio-js, folio-dotnet, the
    accounting tests and the "eleven faces" documentation are NOT in this story. The change is
    the designer host's font input, and nothing else. If the work seems to want a face removed
    from Shipped(), that is the signal to stop and ask, not to widen.

    folio-go/wasm/cmd/engine/main.go takes no fonts from JS today — `wasm.NewEngine(clock)` has
    no font parameter, and internal/wasm/engine.go calls `fonts.Shipped()` at seven sites (133,
    164, 203, 259, 325, 349, 388). Every one of those has to read one set the host owns.
    folio-go/wasm/cmd/render/main.go is the precedent: it compiles in no fonts and takes the
    caller's set through `fontSet(names, faces)` at :150-157. Follow that shape.

    FIRST TASK IS A MEASUREMENT. Build the wasm without the CJK face and report the real served
    (.br) size before touching the core bound. The 6.1 MiB in SPEC.md is a projection from
    brotli-compressing the face standalone (4.72 MiB of the 8.11 MiB sidecar); the bound gets
    pinned to what the build actually emits, by the same derived-not-retyped reader story 1
    established. Report the before and after cold-load numbers.

    The designer already fetches this exact face as a deferred asset — same bytes, sha256
    5ef5755b1ac65021. One fetched copy serves both the canvas and the engine; do not open a
    second fetch path. The preflight from story 3 is what makes the face present before a CJK
    document renders, so a CJK document must still open, preview and render byte-identically.

    Picking a catalogue family embeds its bytes into the .folio; a shipped family writes only a
    name. The CJK face must stay on the name-declared path — if it lands on the embedding path
    every CJK document gains 10 MiB, which is the opposite of this whole spec.

    After the folio-go change, `npm run build:wasm`.
